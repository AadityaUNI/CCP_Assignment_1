<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Greeting Human</title>
    <link rel="stylesheet" href="themes/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="scripts/recordingScript.js"></script>
</head>
<body>
    <main class="flex flex-col">
        <div style="width: auto; height: fit-content;
                    padding: 5px; margin-top: 2%; text-align: center; justify-self: flex-start">
            <img src="images/pic-banner.png" alt="banner for text to speech" style="height: 200px; width: auto;>
            <p class="introtext">Welcome to the best text-to-speech service on the planet!</p>
            <span class="introtext">Get started by clicking the mic or the record button below:</span>
        </div>
        <div class="flex flex-col" style="justify-self: center; justify-content: center; margin-bottom: 200px; align-items: center">
            <img class="readyIMG" style="height: 115px; width: auto; margin-top: 20px; margin-bottom: 20px" src="images/microphone-svgrepo-com.svg" alt="Mic, ready to record">
            <div class="buttonDiv"><button class="recording"></button></div>
        </div>
    </main>
</body>
</html>
